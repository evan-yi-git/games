<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>接住金幣小遊戲</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #1a1a2e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    h1 { margin-bottom: 10px; font-size: 28px; color: #f9d423; }
    #info { font-size: 20px; margin-bottom: 15px; }
    canvas {
      background-color: #16213e;
      border: 4px solid #0f3460;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }
    #restartBtn {
      margin-top: 15px;
      padding: 10px 24px;
      font-size: 18px;
      background-color: #e94560;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: none;
    }
    #restartBtn:hover { background-color: #ff2e63; }
    .hint { margin-top: 10px; font-size: 14px; color: #a0a0a0; }
  </style>
</head>
<body>

  <h1>🪙 接住金幣大作戰</h1>
  <div id="info">分數: <span id="score">0</span> | 生命: <span id="lives">3</span></div>
  <canvas id="gameCanvas" width="400" height="500"></canvas>
  <button id="restartBtn" onclick="resetGame()">重新開始</button>
  <div class="hint">操作方式：使用鍵盤左右方向鍵（← →）或滑鼠移動籃子</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const restartBtn = document.getElementById("restartBtn");

    let score = 0;
    let lives = 3;
    let isGameOver = false;
    let animationId;

    // 玩家籃子設定
    const player = {
      width: 70,
      height: 15,
      x: canvas.width / 2 - 35,
      y: canvas.height - 30,
      speed: 7,
      dx: 0
    };

    // 掉落物陣列（包含金幣與炸彈）
    let items = [];

    // 鍵盤控制
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") player.dx = -player.speed;
      if (e.key === "ArrowRight") player.dx = player.speed;
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") player.dx = 0;
    });

    // 滑鼠與觸控控制
    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      player.x = mouseX - player.width / 2;
      keepPlayerInBounds();
    });

    function keepPlayerInBounds() {
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
    }

    // 隨機生成掉落物
    function spawnItem() {
      if (Math.random() < 0.03) {
        const isBomb = Math.random() < 0.25; // 25% 機率出現炸彈
        items.push({
          x: Math.random() * (canvas.width - 20) + 10,
          y: -15,
          radius: 10,
          speed: 2.5 + Math.random() * 2 + (score * 0.05), // 隨分數微幅加速
          type: isBomb ? "bomb" : "coin"
        });
      }
    }

    // 更新畫面邏輯
    function update() {
      if (isGameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 移動並繪製玩家籃子
      player.x += player.dx;
      keepPlayerInBounds();
      ctx.fillStyle = "#4ecca3";
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // 生成與更新掉落物
      spawnItem();
      for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        item.y += item.speed;

        // 繪製金幣或炸彈
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
        ctx.fillStyle = item.type === "coin" ? "#f9d423" : "#e94560";
        ctx.fill();
        ctx.closePath();

        // 碰撞偵測
        if (
          item.y + item.radius >= player.y &&
          item.y - item.radius <= player.y + player.height &&
          item.x >= player.x &&
          item.x <= player.x + player.width
        ) {
          if (item.type === "coin") {
            score += 10;
            scoreEl.innerText = score;
          } else {
            lives -= 1;
            livesEl.innerText = lives;
            if (lives <= 0) endGame();
          }
          items.splice(i, 1);
          continue;
        }

        // 超出畫面底部移除
        if (item.y - item.radius > canvas.height) {
          items.splice(i, 1);
        }
      }

      animationId = requestAnimationFrame(update);
    }

    function endGame() {
      isGameOver = true;
      cancelAnimationFrame(animationId);
      ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.font = "32px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("遊戲結束！", canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = "20px sans-serif";
      ctx.fillText("最終得分: " + score, canvas.width / 2, canvas.height / 2 + 25);
      restartBtn.style.display = "block";
    }

    function resetGame() {
      score = 0;
      lives = 3;
      items = [];
      isGameOver = false;
      scoreEl.innerText = score;
      livesEl.innerText = lives;
      restartBtn.style.display = "none";
      update();
    }

    // 啟動遊戲
    update();
  </script>
</body>
</html>
